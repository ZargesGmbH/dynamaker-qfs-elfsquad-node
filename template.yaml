AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Elfsquad drawing-generation integration (Node.js) — triggers a job service (DynaMaker
  QFS by default, or any other compatible service) per Elfsquad configurator model ID.

Parameters:
  ElfsquadClientId:
    Type: String
  ElfsquadClientSecret:
    Type: String
  JobServicesByModelId:
    Type: String
    Description: >-
      JSON array routing each supported Elfsquad configurator model ID to the job
      service that renders it. See .env.example for the shape.

Globals:
  Function:
    Timeout: 60
    Runtime: nodejs24.x

Resources:
  QFSTaskTrigger:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: qfs-task-trigger.handler
      Environment:
        Variables:
          ElfsquadClientId: !Ref ElfsquadClientId
          ElfsquadClientSecret: !Ref ElfsquadClientSecret
          QfsCallbackFunctionUrl: !GetAtt QFSCallbackFunctionUrl.FunctionUrl
          JobServicesByModelId: !Ref JobServicesByModelId

  QFSTaskTriggerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt QFSTaskTrigger.Arn
      Cors:
        AllowMethods:
          - PATCH
        AllowOrigins:
          - 'https://ems.elfsquad.io'

  QFSTaskTriggerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QFSTaskTrigger
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  QFSCallback:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: qfs-callback.handler
      Environment:
        Variables:
          ElfsquadClientId: !Ref ElfsquadClientId
          ElfsquadClientSecret: !Ref ElfsquadClientSecret

  QFSCallbackFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt QFSCallback.Arn

  QFSCallbackFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QFSCallback
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  QFSTaskTriggerFunctionUrl:
    Description: "Lambda function URL for QFSTaskTrigger"
    Value: !GetAtt QFSTaskTriggerFunctionUrl.FunctionUrl
