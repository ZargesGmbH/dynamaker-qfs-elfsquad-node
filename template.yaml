AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Elfsquad drawing-generation integration (Node.js) — renders via a self-hosted render-service instead of DynaMaker QFS

Parameters:
  ElfsquadClientId:
    Type: String
  ElfsquadClientSecret:
    Type: String
  ElfsquadConfiguratorModelId:
    Type: String
  RenderServiceUrl:
    Type: String
    Description: >-
      Function URL of the web-cad-test render-service Lambda
      (configurators/w105-output/scripts/render-service/), replaces qfs.dynamaker.com/jobs.
  RenderApiKey:
    Type: String
    Description: Shared secret sent as the x-render-api-key header to RenderServiceUrl.

Globals:
  Function:
    Timeout: 60
    Runtime: nodejs24.x

Resources:
  QFSTaskTrigger:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: qfs-task-trigger.handler
      Environment:
        Variables:
          ElfsquadClientId: !Ref ElfsquadClientId
          ElfsquadClientSecret: !Ref ElfsquadClientSecret
          ElfsquadConfiguratorModelId: !Ref ElfsquadConfiguratorModelId
          QfsCallbackFunctionUrl: !GetAtt QFSCallbackFunctionUrl.FunctionUrl
          RenderServiceUrl: !Ref RenderServiceUrl
          RenderApiKey: !Ref RenderApiKey

  QFSTaskTriggerFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt QFSTaskTrigger.Arn
      Cors:
        AllowMethods:
          - PATCH
        AllowOrigins:
          - 'https://ems.elfsquad.io'

  QFSTaskTriggerFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QFSTaskTrigger
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  QFSCallback:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src
      Handler: qfs-callback.handler
      Environment:
        Variables:
          ElfsquadClientId: !Ref ElfsquadClientId
          ElfsquadClientSecret: !Ref ElfsquadClientSecret

  QFSCallbackFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt QFSCallback.Arn

  QFSCallbackFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref QFSCallback
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  QFSTaskTriggerFunctionUrl:
    Description: "Lambda function URL for QFSTaskTrigger"
    Value: !GetAtt QFSTaskTriggerFunctionUrl.FunctionUrl
